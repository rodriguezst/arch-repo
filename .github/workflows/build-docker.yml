name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - builder/**
      - '.github/workflows/build-docker.yml'
  
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm

    permissions:
      packages: write   # allow pushing to ghcr.io
      contents: read    # allow reading repo content

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          cd builder
          docker build -t ghcr.io/${{ github.repository_owner }}/archlinux-builder:latest .
          docker image push ghcr.io/${{ github.repository_owner }}/archlinux-builder:latest
        env:
          DOCKER_BUILDKIT: 0
